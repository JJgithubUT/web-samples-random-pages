<section class="sec" id="coleccion">
  <div class="sec__head">
    <div>
      <p class="idx">01 — Colección</p>
      <h2 class="sec__t">Todo lo que cuelga<br>ahora mismo</h2>
    </div>
    <p class="sec__d">El fondo completo, sin orden jerárquico.</p>
  </div>

  <div class="controls">
    <div class="filters" id="filters" role="group" aria-label="Filtrar por técnica">
      <button class="chip is-on" data-f="todas">Todas</button>
      <button class="chip" data-f="pintura">Pintura</button>
      <button class="chip" data-f="grafica">Obra gráfica</button>
      <button class="chip" data-f="fotografia">Fotografía</button>
      <button class="chip" data-f="digital">Digital</button>
      <button class="chip chip--fav" data-f="guardadas">♥ Guardadas</button>
    </div>

    <div class="density" role="group" aria-label="Densidad de la cuadrícula">
      <span class="density__l">Columnas</span>
      <button class="dbtn" data-c="2">2</button>
      <button class="dbtn is-on" data-c="3">3</button>
      <button class="dbtn" data-c="4">4</button>
    </div>
  </div>

  <p class="count" id="count" role="status"></p>
  <div class="masonry" id="masonry"></div>
  <p class="empty" id="empty" hidden>Todavía no has guardado ninguna obra.</p>
</section>
