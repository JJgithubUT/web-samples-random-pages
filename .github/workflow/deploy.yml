name: Deploy static HTML to GitHub Pages

on:
  # Se ejecuta cada vez que haces push a la rama principal (puedes cambiar 'main' por 'master')
  push:
    branches: [ "main" ]

  # Permite ejecutar este workflow manualmente desde la pestaña "Actions" en GitHub
  workflow_dispatch:

# Permisos necesarios para leer el repositorio y escribir en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Solo permite un despliegue concurrente, saltándose los pendientes si hay uno en curso
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      name_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefactos
        uses: actions/upload-pages-artifact@v3
        with:
          # Especifica la carpeta donde está tu index.html. 
          # Si está en la raíz, déjalo como '.'
          path: '.'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4